{% include base_path %}

<header class="minimal-nav">

      {{ site.title }}
    </a>

    <nav class="minimal-nav__links">
      <a href="{{ '/publications/' | relative_url }}" class="minimal-nav__link {% if page.url contains '/publications' %}active{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        Research

      <a href="{{ '/teaching/' | relative_url }}" class="minimal-nav__link {% if page.url contains '/teaching' %}active{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
